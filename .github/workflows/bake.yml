name: Refresh baked data

# The page is static, so the only thing that goes stale is data/. This rebuilds
# it daily and commits the result, which republishes Pages automatically.
on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily, off the top of the hour
  workflow_dispatch:        # and on demand, from the Actions tab

permissions:
  contents: write           # needed to push the refreshed data back

concurrency:
  group: bake
  cancel-in-progress: false  # never kill a bake midway through its API calls

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Guard the committed data: if the logic is broken, fail before
      # overwriting a good dataset with a bad one.
      - name: Self-checks
        run: |
          python coach.py demo
          python bake_stratz.py --selftest

      - name: Bake OpenDota aggregates
        run: python bake.py

      # Optional. Without the secret the bracket data simply keeps its previous
      # contents rather than failing the whole run.
      - name: Bake STRATZ brackets
        env:
          STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
        run: |
          if [ -z "$STRATZ_TOKEN" ]; then
            echo "::warning title=No STRATZ token::STRATZ_TOKEN secret is not set, so data/brackets.json was left as-is. Add it with: gh secret set STRATZ_TOKEN"
            exit 0
          fi
          python bake_stratz.py

      - name: Sanity-check the output before committing
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("data/dota.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          n = len(d.get("heroes", {}))
          # A partial bake is worse than yesterday's data, so refuse it.
          if n < 100:
              sys.exit(f"Only {n} heroes baked; refusing to commit a partial dataset.")
          print(f"{n} heroes, {p.stat().st_size // 1024} KB")
          PY

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data/; then
            echo "Data unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Refresh baked data ($(date -u +%Y-%m-%d))"
          git push
